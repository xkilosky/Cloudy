name: Build Cloudy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build Cloudy Offline Web Bundle
        run: |
          npm ci
          npm run icons
          npm run build
          npx cap sync android
          node scripts/setup-android-icons.mjs

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Cloudy-X-Kilo.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloudy-X-Kilo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
